    (function() {
      const origWarn = console.warn;
      const origInfo = console.info;
      console.warn = function(...args) {
        if (typeof args[0] === 'string' && (
          args[0].includes('cdn.tailwindcss.com') ||
          args[0].includes('Babel transformer') ||
          args[0].includes('defaultProps')

        origWarn.apply(console, args);
      };
      console.info = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('React DevTools')) return;
        origInfo.apply(console, args);
      };
    })();
  </script>

                {/* RIGHT PANEL: AGENT INSPECTOR */}
                {selectedAgent && activeAgent && (
                  <div className="w-72 glass-panel border-t-0 border-b-0 border-r-0 flex flex-col z-20 shadow-[-10px_0_20px_rgba(0,0,0,0.3)] shrink-0 animate-[slideIn_0.2s_ease-out]">
                    <div className="p-3 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between">
                      <span className="text-xs font-semibold text-slate-400 uppercase tracking-widest">Inspector</span>
                      <button onClick={() => setSelectedAgent(null)} className="p-1 text-slate-400 hover:text-white hover:bg-slate-800 rounded transition-colors">
                        <PanelRightClose className="w-4 h-4" />
                      </button>
                    </div>
                    
                    <div className="p-5 flex flex-col gap-4">
                      {/* Header */}
                      <div className="flex items-center gap-3">
                        <div className={`relative flex items-center justify-center w-10 h-10 rounded-full border-2
                            ${activeAgent.state === 'idle' ? 'bg-slate-800 border-slate-600' : ''}
                            ${activeAgent.state === 'computing' ? 'bg-cyan-950 border-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.4)]' : ''}
                            ${activeAgent.state === 'blocked' ? 'bg-amber-950 border-amber-500 border-dashed' : ''}
                          `}>
                          {activeAgent.state !== 'blocked' && <span className={`text-xs font-bold ${activeAgent.state==='computing' ? 'text-cyan-400' : 'text-slate-400'}`}>{activeAgent.name[0]}</span>}
                          {activeAgent.state === 'blocked' && <Lock className="w-4 h-4 text-amber-500 z-10" />}
                        </div>
                        <div>
                          <h2 className="text-sm font-bold text-white">{activeAgent.name} Agent</h2>
                          <div className="text-[10px] uppercase font-mono text-slate-500 mt-0.5">Status: {activeAgent.state}</div>
                        </div>
                      </div>
                      
                      <p className="text-xs text-slate-400 leading-relaxed border-b border-slate-800 pb-4">
                        {activeAgent.desc}
                      </p>

                      {/* Skills */}
                      <div>
                        <h3 className="text-[10px] font-semibold text-slate-500 uppercase tracking-widest mb-3">Available Skills</h3>
                        <div className="space-y-2">
                          {activeAgent.skills.map(skill => (
                            <div key={skill} className="flex items-center justify-between p-2 rounded bg-slate-900/50 border border-slate-800 hover:border-slate-600 cursor-pointer transition-colors group">
                              <code className="text-xs text-indigo-300 font-mono group-hover:text-indigo-200">{skill}</code>
                              <ChevronRight className="w-3 h-3 text-slate-600 group-hover:text-slate-400" />
                            </div>
                          ))}
                        </div>
                      </div>
                      
                      {activeAgent.state === 'blocked' && (
                        <div className="mt-4 p-3 rounded bg-amber-950/30 border border-amber-500/30">
                          <div className="flex items-center gap-2 text-amber-500 mb-1">
                            <Lock className="w-3 h-3" />
                            <span className="text-xs font-bold uppercase tracking-wide">Approval Required</span>
                          </div>
                          <p className="text-[10px] text-amber-200/70 leading-relaxed">Agent requires human approval to escalate external supplier warning.</p>
                        </div>
                      )}

                    </div>
                  </div>
                )}
              </>
            )}
            
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SubjectRoomDashboard />);
  </script>
</body>
</html>
